    return [[5,11],[7,11],[7,13],[11,13],[11,17],[13,17],[13,19]].map(([p,q]) => {
      const phi = (p - 1) * (q - 1);
      return {id:`rsa-${p}-${q}`,kind:"q",p:`Küçük RSA örneğinde p=${p} ve q=${q}. φ(n) kaçtır?`,a:String(phi),options:[phi,p*q,p+q,phi+1].map(String),why:`p ve q farklı asal sayılar olduğu için φ(n) = (p − 1)(q − 1) = ${phi}.`,
        ref:"Web Güvenliği-04-Şifreleme Algoritmaları_2_0.pdf · s. 23–28 ve 35–38, RSA örnekleri"};
    });
  }
  return [];
}


const banks = { js, ai, web, etik, guvenlik, ibe, bulut, three };
const pools = Object.fromEntries(courses.map(({ id }) => [id, [...banks[id], ...variants(id)]]));
const kinds = { q: "Çoktan seçmeli", t: "Kısa yanıt", o: "Sıralama", m: "Eşleştirme", w: "Açık uçlu" };
const root = document.querySelector("main");
const storageKey = "vize-atolyesi-2026-v1";
let data;
let persistent = true;
try {
  data = JSON.parse(localStorage.getItem(storageKey)) || {};
} catch {
  data = {};
  persistent = false;
}
let course;
let mode = "mix";
let turn;
let reviewing = false;

function state(id) {
  return data[id] ??= { seen: [], attempts: {} };
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(data));
  } catch {
    persistent = false;
    document.querySelector(".local").textContent = "İlerleme bu oturumda";
  }
}

function shuffled(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === false || value == null) continue;
    if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child != null) el.append(child);
  }
  return el;
}
const button = (label, click, extra = {}) => h("button", { type: "button", class: "btn", onclick: click, ...extra }, label);

function totals(id, pool = pools[id], attempts = state(id).attempts) {
  const completed = pool.filter(q => attempts[q.id]);
  const correct = completed.filter(q => attempts[q.id].correct).length;
  return { done: completed.length, wrong: completed.length - correct, correct,
    success: completed.length ? Math.round(correct * 100 / completed.length) : null };
}

function currentRound() {
  return mode === "review" ? undefined : state(course.id).rounds?.[mode];
}

function startRound() {
  const progress = state(course.id);
  progress.rounds ??= {};
  progress.rounds[mode] = { attempts: {}, skipped: [] };
  save();
  nextQuestion();
}

function showHome() {
  const total = Object.values(pools).reduce((sum, list) => sum + list.length, 0);
  root.replaceChildren(
    h("section", { class: "hero" },
      h("span", { class: "eyebrow" }, "Vize hazırlığı · Kasım 2026"),
      h("h1", {}, "Bugün ne çalışıyoruz?"),
      h("p", {}, "Bir ders seç, alıştırmaları çöz ve takıldığın sorulara geri dön. Her derste yeni sorular önce gelir.")),
    h("div", { class: "section-title" }, h("h2", {}, "Dersler"), h("span", { class: "small" }, `8 ders · ${total} soru`)),
    h("div", { class: "grid" }, courses.map((c, i) => {
      const { done, wrong, success } = totals(c.id);
      return h("a", { class: "card", href: `#${c.id}` },
        h("span", { class: "badge" }, `${String(i + 1).padStart(2, "0")} · ${c.short}`),
        h("h3", {}, c.name), h("span", { class: "small" }, c.format),
        h("span", { class: "small" }, `${done}/${pools[c.id].length} cevaplandı${success === null ? "" : ` · %${success} başarı`}${wrong ? ` · ${wrong} tekrar` : ""} →`));
    }))
  );
}

function candidates() {
  const list = pools[course.id];
  if (mode === "review") {
    const attempts = state(course.id).attempts;
    return list.filter(q => attempts[q.id] && !attempts[q.id].correct);
  }
  return mode === "mix" ? list : list.filter(q => q.kind === mode);
}

function nextQuestion() {
  const list = candidates();
  const progress = currentRound() ?? state(course.id);
  const skipped = progress.skipped || [];
  let available = mode === "review" ? [] : list.filter(q => !progress.attempts[q.id] && !skipped.includes(q.id));
  reviewing = mode === "review" || !available.length;
  if (reviewing) available = list.filter(q => progress.attempts[q.id]?.correct === false);
  if (!available.length) {
    turn = null;
    showCourse(true);
    return;
  }
  if (available.length > 1) available = available.filter(q => q.id !== turn?.q.id);
  const different = available.filter(q => q.kind !== turn?.q.kind);
  const q = shuffled(different.length ? different : available)[0];
  const sequence = q.kind === "o" ? shuffled(q.a) : [];
  if (sequence.length > 1 && sequence.every((item, i) => item === q.a[i])) sequence.push(sequence.shift());
  turn = { q, options: shuffled(q.options || []), pairOptions: q.kind === "m" ? shuffled(q.a.map(([, a]) => a)) : [],
    sequence, selected: "", input: "", pairs: {}, revealed: false, result: null };
  showCourse(true);
}

function skipQuestion() {
  const progress = currentRound() ?? state(course.id);
  progress.skipped ??= [];
  if (!progress.skipped.includes(turn.q.id)) progress.skipped.push(turn.q.id);
  save();
  nextQuestion();
}

function finish(correct) {
  if (turn.result !== null) return;
  turn.result = correct;
  const attempts = state(course.id).attempts;
  const last = attempts[turn.q.id];
  attempts[turn.q.id] = { correct, count: (last?.count ?? 0) + 1 };
  const round = currentRound();
  if (round) round.attempts[turn.q.id] = { correct };
  save();
  showCourse();
  document.querySelector("#feedback")?.focus();
}

function normalized(value) {
  return value.trim().replace(/^(['"])(.*)\1$/, "$2").replace(/\s*,\s*/g, ",").toLocaleLowerCase("en-US");
}

function check() {
  const { q } = turn;
  if (q.kind === "q") finish(turn.selected === q.a);
  if (q.kind === "t") finish(normalized(turn.input) === normalized(q.a));
  if (q.kind === "o") finish(q.a.every((v, i) => v === turn.sequence[i]));
  if (q.kind === "m") finish(q.a.every(([k, v]) => turn.pairs[k] === v));
  if (q.kind === "w") {
    turn.revealed = true;
    showCourse();
    document.querySelector("#feedback")?.focus();
  }
}

function isReady() {
  switch (turn.q.kind) {
    case "q": return Boolean(turn.selected);
    case "t":
    case "w": return Boolean(turn.input.trim());
    case "m": return turn.q.a.every(([k]) => turn.pairs[k]);
    default: return true;
  }
}

function updateCheck() {
  document.querySelector("#check").disabled = !isReady();
}

function exerciseInput() {
  const { q, result, revealed } = turn;
  const locked = result !== null || revealed;
  if (q.kind === "q") return h("div", { class: "options" }, turn.options.map((value, i) => {
    const selected = turn.selected === value;
    const css = locked && value === q.a ? "correct" : locked && selected ? "wrong" : selected ? "selected" : "";
    return h("button", {
      type: "button", class: `opt ${css}`, "aria-pressed": String(selected), disabled: locked,
      onclick: event => {
        turn.selected = value;
        for (const option of document.querySelectorAll(".opt")) {
          const active = option === event.currentTarget;
          option.classList.toggle("selected", active);
          option.setAttribute("aria-pressed", String(active));
        }
        updateCheck();
      }
    }, h("span", {}, String.fromCharCode(65 + i)), h("span", {}, value));
  }));
  if (q.kind === "t" || q.kind === "w") {
    const el = h(q.kind === "t" ? "input" : "textarea", { class: "answer", "aria-label": "Cevabın",
      placeholder: q.kind === "t" ? "Cevabını yaz" : "Kendi cevabını yaz, ardından örnekle karşılaştır",
      disabled: locked, oninput: event => { turn.input = event.target.value; updateCheck(); },
      onkeydown: event => { if (q.kind === "t" && event.key === "Enter" && isReady() && !locked) check(); } });
    el.value = turn.input;
    return el;
  }
  if (q.kind === "m") return h("div", { class: "pairs" }, q.a.map(([name], i) => {
    const select = h("select", { id: `pair-${i}`, disabled: locked, onchange: event => {
      turn.pairs[name] = event.target.value;
      updateCheck();
    } }, h("option", { value: "" }, "Eşleştir"), turn.pairOptions.map(x => h("option", { value: x }, x)));
    select.value = turn.pairs[name] || "";
    return h("div", { class: "pair" }, h("label", { for: `pair-${i}` }, name), select);
  }));
  return h("ol", { class: "order" }, turn.sequence.map((value, i) => {
    function move(delta) {
      [turn.sequence[i], turn.sequence[i + delta]] = [turn.sequence[i + delta], turn.sequence[i]];
      showCourse();
      const target = i + delta;
      const control = document.querySelector(`#move-${target}-${delta}`);
      (control?.disabled ? document.querySelector(`#move-${target}-${-delta}`) : control)?.focus();
    }
    return h("li", { class: "step" }, h("span", {}, `${i + 1}. ${value}`), h("span", { class: "moves" },
      button("↑", () => move(-1), { id: `move-${i}--1`, "aria-label": `${value} yukarı`, disabled: locked || i === 0 }),
      button("↓", () => move(1), { id: `move-${i}-1`, "aria-label": `${value} aşağı`, disabled: locked || i === turn.sequence.length - 1 })));
  }));
}

function explanation() {
  const { q, result, revealed } = turn;
  if (result === null && !revealed) return null;
  const answer = q.kind === "m" ? q.a.map(([k, v]) => `${k} → ${v}`).join("\n")
    : q.kind === "o" ? q.a.map((v, i) => `${i + 1}. ${v}`).join("\n") : q.a;
  return h("div", { id: "feedback", class: `feedback ${result === true ? "good" : result === false ? "bad" : ""}`, tabindex: "-1", "aria-live": "polite" },
    h("strong", {}, q.kind === "w" ? "Örnek cevap" : result ? "Doğru" : "Tekrara eklendi"),
    h("p", {}, answer), h("p", {}, h("strong", {}, q.kind === "w" ? "Cevabını değerlendir. " : "Bu cevap neden doğru? "), q.why),
    q.ref ? h("p", { class: "small" }, h("strong", {}, "Kaynak "), q.ref) : null);
}

function questionPanel() {
  if (!turn) {
    const progress = currentRound() ?? state(course.id);
    const postponed = mode !== "review" && candidates().some(q => !progress.attempts[q.id] && progress.skipped?.includes(q.id));
    return h("div", {}, h("h2", { id: "question", tabindex: "-1" }, postponed ? "Yeni sorular bitti" : mode === "review" ? "Tekrar kuyruğu boş" : "Bu grubu tamamladın"),
      postponed ? h("div", {}, h("p", { class: "muted" }, "Daha sonra çözmek için ayırdığın sorular var."),
        button("Atladığım sorulara dön", () => {
          const selected = new Set(candidates().map(q => q.id));
          progress.skipped = progress.skipped.filter(id => !selected.has(id));
          save();
          nextQuestion();
        })) : h("div", {},
          h("p", { class: "muted" }, "Bu grupta tekrar bekleyen soru yok."),
          mode === "review" ? button("Tüm sorulara dön", () => {
            mode = "mix";
            nextQuestion();
          }) : button("Yeni tur başlat", startRound, { class: "btn primary" })));
  }
  const { q, result, revealed } = turn;
  const [prompt, ...code] = q.p.split("\n");
  const actions = [];
  if (revealed && result === null) {
    actions.push(button("Ölçütleri karşıladım", () => finish(true), { class: "btn primary" }),
      button("Tekrar etmek istiyorum", () => finish(false)));
  } else if (result === null) {
    actions.push(button(q.kind === "w" ? "Örnek cevabı göster" : "Cevabı kontrol et", check, { id: "check", class: "btn primary", disabled: !isReady() }),
      reviewing ? null : button("Sonra çöz", skipQuestion));
  } else {
    const attempts = (currentRound() ?? state(course.id)).attempts;
    actions.push(button(reviewing && result === false && candidates().filter(q => attempts[q.id]?.correct === false).length === 1 ? "Tekrar çöz" : "Devam et →", nextQuestion, { class: "btn primary" }));
  }
  return h("div", {}, h("span", { class: "badge" }, kinds[q.kind]),
    reviewing ? h("p", { class: "small" }, "Yanlış tekrarı · Doğru cevapladığında soru bu kuyruktan çıkar.") : null,
    h("h2", { id: "question", class: "prompt", tabindex: "-1" }, prompt),
    code.length ? h("pre", {}, h("code", {}, code.join("\n"))) : null,
    exerciseInput(), explanation(), h("div", { class: "actions" }, actions));
}

function showCourse(focus = false) {
  const pool = pools[course.id];
  const round = currentRound();
  const scoredPool = round ? candidates() : pool;
  const { done, wrong, correct, success } = totals(course.id, scoredPool, round?.attempts);
  const options = [["mix", "Karışık"], ...Object.entries(kinds).filter(([k]) => pool.some(q => q.kind === k)), ["review", "Yanlışlarım"]];
  const selector = h("select", { id: "mode", onchange: event => {
    mode = event.target.value;
    nextQuestion();
  } }, options.map(([key, label]) => h("option", { value: key }, label)));
  selector.value = mode;
  root.replaceChildren(
    h("a", { class: "back", href: "#" }, "← Tüm dersler"),
    h("section", { class: "course-head" }, h("span", { class: "eyebrow" }, course.format),
      h("h1", {}, course.name), h("p", { class: "muted" }, course.source)),
    h("div", { class: "workspace" },
      h("section", { class: "panel", "aria-label": "Alıştırma" },
        h("div", { class: "toolbar" }, h("label", { for: "mode" }, "Soru türü"), selector),
        h("div", { class: "stats", "aria-live": "polite" },
          h("span", {}, `${round ? "Bu tur: " : ""}${done}/${scoredPool.length} cevaplandı`),
          h("strong", {}, success === null ? "Başarı: —" : `Başarı %${success} · ${correct}/${done} doğru`),
          h("span", {}, `${wrong} tekrar bekliyor`)),
        h("p", { class: "small" }, round ? "Bu turdaki başarı, burada verdiğin son cevaplara göre hesaplanır." : "Başarı, cevapladığın her sorunun son sonucuna göre hesaplanır."),
        questionPanel()),
      h("aside", { class: "side" },
        h("details", { class: "panel", open: true }, h("summary", {}, "Hızlı konu tekrarı"),
          h("ul", {}, course.notes.map(note => h("li", {}, note)))),
        h("div", { class: "panel sources" }, h("h2", {}, "Kaynaklar"), h("p", { class: "small" }, course.source),
          course.links.map(([label, url]) => h("a", { href: url, target: "_blank", rel: "noopener noreferrer" }, label)))
      )
    )
  );
  if (focus) document.querySelector("#question")?.focus();
}

function route() {
  course = courses.find(c => c.id === location.hash.slice(1));
  mode = "mix";
  turn = null;
  document.title = course ? `${course.name} · Vize Atölyesi` : "Vize Atölyesi";
  if (course) nextQuestion();
  else showHome();
}

if (!persistent) document.querySelector(".local").textContent = "İlerleme bu oturumda";
document.querySelector(".skip").addEventListener("click", event => {
  event.preventDefault();
  root.focus();
});
window.addEventListener("hashchange", route);
route();

})();
</script>
</body>
</html>
